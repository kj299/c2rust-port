# CI for the Porting Kit repo ITSELF (not a port that uses it). This repo is the
# kit — there is no root Rust workspace — so the kit's own `porting-ci.template.yml`
# (build/miri/sanitizers/differential against crates/**) does NOT apply here. The
# kit's gate is `make check-kit` (its harness self-tests + doc/skills integrity),
# plus building the skeleton it ships. Path-scoped per LESSONS #5.
name: check-kit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-kit:
    name: make check-kit (harness self-tests + integrity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # python3 + bash + make only — no Rust toolchain needed. Runs every
      # harness self-test, the doc-flag drift check, and the skills-integrity check.
      - run: make check-kit

  skeleton:
    name: skeleton workspace (fmt + clippy + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skeleton
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      # The skeleton must pass the very lints it configures (workspace
      # [lints]: arithmetic_side_effects, cast_possible_truncation, the unsafe
      # docs). If it doesn't, every port that copies it starts red.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release
      - run: cargo test --all

# cargo-fuzz crate for the cJSON port: in-process fuzzing of the Rust ALONE.
# diff_fuzz.py (check.sh step 4) compares the port to the C; these targets ask a
# different question — can any input make the port panic, abort, overflow or
# hit UB — at libFuzzer speed and with coverage feedback. Built only by
# `cargo +nightly fuzz` (check.sh step 4c); NOT a member of ../Cargo.toml's
# workspace, so it never touches the stable build, and its registry
# dependencies (libfuzzer-sys) live in THIS directory's Cargo.lock, which the
# supply-chain step audits separately.
[package]
name = "cjson-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.cjson_core]
path = "../crates/core"

# Keep this crate out of the parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "parse_print"
path = "fuzz_targets/parse_print.rs"
test = false
doc = false
bench = false

[[bin]]
name = "modes"
path = "fuzz_targets/modes.rs"
test = false
doc = false
bench = false

# cJSON port workspace — layering per the kit skeleton (ARCHITECTURE-TEMPLATE):
#   core   : #![forbid(unsafe_code)] — the translated cJSON logic (value model,
#            parse, print). Everything observable lives here.
#   driver : thin bin implementing the same stdin→stdout contract as
#            ../oracle/driver.c, so diff_run can diff the two byte-for-byte.
#   ffi    : the C-ABI `cJSON_*` surface as a cdylib (libcjson_rs.so) — the
#            ONLY crate with `unsafe`, every block // SAFETY:-documented and
#            audited; it wraps the safe core for drop-in-.so consumers.
[workspace]
resolver = "2"
members = ["crates/core", "crates/driver", "crates/ffi"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.74"

[profile.release]
# Overflow checks ON even in release: silent wraparound is exactly the class of
# C bug a safety-first rewrite must not reproduce (kit skeleton default).
overflow-checks = true
lto = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
cast_possible_truncation = "warn"
arithmetic_side_effects = "warn"

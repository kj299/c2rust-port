[[mutant.edit]]
file = "rust/crates/core/src/dom.rs"
old = "pub fn get_object_item<'a>(v: &'a Value, name: &[u8], case_sensitive: bool) -> Option<&'a Value> {\n    let Value::Object(entries) = v else {\n        return None;\n    };\n    entries\n        .iter()\n        .find(|(k, _)| {\n            if case_sensitive {\n                // C-string compare (strcmp): both sides truncate at the first NUL.\n                strcmp_eq(k, name)\n            } else {\n                eq_ci(k, name)\n            }"
new = "pub fn get_object_item<'a>(v: &'a Value, name: &[u8], case_sensitive: bool) -> Option<&'a Value> {\n    let Value::Object(entries) = v else {\n        return None;\n    };\n    entries\n        .iter()\n        .find(|(k, _)| {\n            if case_sensitive {\n                // C-string compare (strcmp): both sides truncate at the first NUL.\n                strcmp_eq(k, name)\n            } else {\n                strcmp_eq(k, name)\n            }"

[[mutant]]
name = "fmt-colon-space"
rule = "a formatted object member's colon is followed by a tab (fmt-object, fmt-nested-obj-in-array)"
[[mutant.edit]]
file = "rust/crates/core/src/print.rs"
old = "            self.out.push(b':');\n            if self.format {\n                self.out.push(b'\\t');\n            }"
new = "            self.out.push(b':');\n            if self.format {\n                self.out.push(b' ');\n            }"

# No mutant for the colon site's missing NUL slot (print.rs, cJSON.c:1783):
# rounding it up is EQUIVALENT. Whatever follows a colon reserves more than
# the colon does, so the colon is never the tightest site and no document's
# failure boundary moves; measured 2026-11-14, 605 documents x 2 formats x 8
# buffer sizes around each boundary, 9,650 runs, port and mutant identical.


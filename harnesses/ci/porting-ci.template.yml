# Safety-first CI for a C-to-Rust port. Copy to .github/workflows/ci.yml and tune.
# The matrix is organized around SAFETY GATES, not OS coverage — the point of the
# rewrite is safety, so the pipeline centers on proving it. Keep a small OS row if
# your port is cross-platform; it is not the focus.
#
# Gates (each PLAYBOOK Phase 4 / cross-cutting control):
#   build+test | clippy -D warnings | unsafe-audit (HARD FAIL) | miri |
#   sanitizers | fuzz smoke (+ nightly deep) | supply-chain (audit + deny) |
#   cargo-vet | SBOM | secret-scan (gitleaks) | differential (+ diff-fuzz)
#
# Supply-chain hygiene baked in (OPERATING-GUIDE §3): every `uses:` is pinned by
# commit SHA (a tag is mutable supply chain) with the human version in a trailing
# comment; `permissions: contents: read` (least privilege); `persist-credentials:
# false` so a later compromised step can't reuse the checkout token to push. Bump
# the pins with Dependabot/Renovate — they understand the `# vX.Y` comment.
#
# LESSONS #10 — CI runs in the TARGET repo's GitHub, not yours, and third-party
# actions are a dependency that environment can BLOCK. This template uses
# dtolnay/rust-toolchain etc.; a repo whose Actions policy allows only first-party
# `actions/*` will fail the WHOLE run at startup (conclusion=startup_failure, zero
# jobs) before any step — which reads like a red test result but is policy, not
# code. Verify this template actually runs in the target repo before relying on it;
# if third-party actions are blocked, fall back to `actions/checkout` + the runner's
# preinstalled toolchains via `run:` steps (see this repo's .github/workflows/
# check-kit.yml for that pattern). SHA-pin the actions you do keep (§5 backlog #5).
name: porting-ci

# LESSONS #5 — path-scope CI to what it actually builds. During a gradual port the
# C tree and the Rust workspace coexist in one repo; an unscoped `on: [push]` runs
# this whole safety pipeline on changes it cannot affect (docs, the C tree), wasting
# CI and leaving PRs misleadingly "unstable" while unrelated jobs drain. Scope this
# Rust workflow to the Rust paths, and scope the C workflow to the C paths, so each
# change triggers only the pipeline that can be affected by it. Tune the globs.
on:
  push:
    # porting-kit/** is included because several jobs below EXECUTE kit scripts
    # (unsafe-audit, sanitizers, supply-chain, differential) — a kit update must
    # re-run the pipeline that depends on it.
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'porting-kit/**', '.github/workflows/porting-ci.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'porting-kit/**', '.github/workflows/porting-ci.yml']
  schedule:
    # Nightly DEEP tier: the long fuzz / diff-fuzz sweeps that are too slow to pay
    # on every PR. The same jobs run per-PR as a fast smoke; `github.event_name ==
    # 'schedule'` widens the budget (see the fuzz + differential jobs).
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  build-test:
    name: build + test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      # Pinned by SHA + explicit `toolchain:` (the @stable/@nightly branch shortcut
      # can't be SHA-pinned without losing which toolchain it selects).
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with: { toolchain: stable, components: clippy, rustfmt }
      - run: cargo fmt --all -- --check
      # -D warnings escalates the workspace safety lints (see skeleton Cargo.toml
      # [workspace.lints]) to hard errors. The explicit -D flags below are
      # belt-and-suspenders so this gate holds even if a repo copies this CI
      # without the [workspace.lints] table — every `unsafe fn` needs `# Safety`,
      # every `unsafe {}` a doc (cross-checks the audit harness). (LESSONS #3)
      - run: >
          cargo clippy --all-targets --
          -D warnings
          -D clippy::missing_safety_doc
          -D clippy::undocumented_unsafe_blocks
      - run: cargo test --all

  unsafe-audit:
    name: unsafe-audit (hard fail on undocumented unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: { python-version: "3.11" }
      # Fails the build if ANY `unsafe {}` block lacks a // SAFETY: comment.
      - run: python3 porting-kit/harnesses/unsafe-audit/audit_unsafe.py crates/

  miri:
    name: miri (UB in unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with: { toolchain: nightly, components: miri }
      # Per-PR this runs the whole workspace; for a large tree, scope it to the
      # changed crates on PR and keep the full sweep for the nightly `schedule`
      # (e.g. a paths-filter / cargo-hakari or a `-p <crate>` matrix).
      - run: cargo +nightly miri test

  sanitizers:
    name: sanitizers (asan + ubsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      # rust-src is REQUIRED: run_sanitizers.sh uses `-Zbuild-std`, which
      # rebuilds the standard library from source; without the component the
      # job fails on first use (and an always-red gate gets deleted, not fixed).
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with: { toolchain: nightly, components: rust-src }
      # Like miri: whole workspace per-PR here; scope to changed crates on PR and
      # keep the full sweep nightly once the tree is large enough to matter.
      - run: bash porting-kit/harnesses/sanitizers/run_sanitizers.sh asan .
      - run: bash porting-kit/harnesses/sanitizers/run_sanitizers.sh ubsan .

  fuzz:
    name: fuzz (60s smoke per-PR; deep nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with: { toolchain: nightly }
      - run: cargo install cargo-fuzz
      # Fast smoke per-PR; the nightly `schedule` run gets a long budget. An empty
      # target list FAILS: "no panic on input" is a hard gate, and a repo with no
      # fuzz/ directory must not get a vacuous green (gen_fuzz_target.sh scaffolds
      # a target per module).
      - run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then T=1800; else T=60; fi
          targets="$(cargo fuzz list)"
          if [ -z "$targets" ]; then
            echo "::error::no cargo-fuzz targets found — the fuzz gate cannot pass vacuously"
            exit 1
          fi
          for t in $targets; do
            cargo fuzz run "$t" -- -max_total_time=$T
          done

  supply-chain:
    name: supply-chain (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with: { toolchain: stable }
      - run: cargo install cargo-audit cargo-deny
      - run: bash porting-kit/harnesses/supply-chain/run_supply_chain.sh .

  cargo-vet:
    name: supply-chain (cargo vet — dependency code review)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with: { toolchain: stable }
      - run: cargo install cargo-vet
      # cargo-audit/deny gate KNOWN CVEs + licenses; cargo-vet reviews the ACTUAL
      # dependency source and records who audited what. One-time setup: `cargo vet
      # init`, then import a trusted registry and certify. `--locked` fails the
      # build when the audit set is incomplete, so new/updated deps can't slip in
      # un-reviewed. Delete this job only if you adopt cargo-crev instead.
      - run: cargo vet --locked

  sbom:
    name: SBOM (auditable binary + CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with: { toolchain: stable }
      - run: cargo install cargo-auditable cargo-cyclonedx
      # Embed the dependency graph IN the release binary so a consumer can scan
      # exactly what you shipped, and emit a CycloneDX SBOM file alongside. Upload
      # bom.json as a release asset from your release workflow.
      - run: cargo auditable build --release
      - run: cargo cyclonedx --format json --override-filename bom

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0   # full history so a secret committed in ANY commit is caught
      # Asserts no tokens/keys are committed. Free for public repos and individual
      # accounts; organizations need a (free) GITLEAKS_LICENSE env var.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9

  differential:
    name: differential vs C oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with: { toolchain: stable }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: { python-version: "3.11" }
      # Build both, then diff over the input matrix. If the C reference can't run
      # here, replace --oracle with the golden-replay wrapper (harnesses/golden).
      # For a C-ABI LIBRARY (not an executable) use harnesses/library-differential
      # /lib_diff.py instead — same ledger, per-function return + output-buffer diff.
      - run: |
          cargo build --release
          # ./build-c-oracle.sh   # your C build
          python3 porting-kit/harnesses/differential/diff_run.py \
            --oracle ./c-oracle --rust ./target/release/<binary> \
            --matrix porting-kit/harnesses/differential/input-matrix.example.toml \
            --ledger DIVERGENCES.md
          # Differential FUZZING: same mutated input to both, hunt semantic
          # divergences the matrix never had. Fast fixed-seed smoke per-PR; the
          # nightly `schedule` run gets a long wall-clock sweep instead.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            FUZZ="--max-time 1800"
          else
            FUZZ="--seed 0 --iterations 2000"
          fi
          python3 porting-kit/harnesses/diff-fuzz/diff_fuzz.py \
            --oracle ./c-oracle --rust ./target/release/<binary> \
            --matrix porting-kit/harnesses/differential/input-matrix.example.toml \
            --ledger DIVERGENCES.md --findings-dir fuzz-findings $FUZZ
          # Performance gate: fail a case >1.3x the C median (a perf bug, not the
          # cost of Rust). Give matrix cases a real workload or they read UNMEASURABLE.
          python3 porting-kit/harnesses/perf/perf_gate.py \
            --oracle ./c-oracle --rust ./target/release/<binary> \
            --matrix porting-kit/harnesses/differential/input-matrix.example.toml
          # For a C-ABI LIBRARY port, run a function-level differential instead of the
          # whole-program one above — either main's driver-based cando:
          #   python3 porting-kit/harnesses/cando/cando_diff.py \
          #     --oracle-driver ./cando_c --rust-driver ./cando_rust \
          #     --vectors vectors.toml --ledger DIVERGENCES.md
          # or the no-driver ctypes alternative:
          #   python3 porting-kit/harnesses/library-differential/lib_diff.py \
          #     --c-lib ./libfoo_c.so --rust-lib ./target/release/libfoo.so \
          #     --vectors vectors.json --ledger DIVERGENCES.md

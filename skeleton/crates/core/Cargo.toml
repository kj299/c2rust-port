[package]
# NOT named `core`: Cargo would allow it, but it shadows Rust's built-in core
# crate in the extern prelude, is a reserved name on crates.io, and makes
# `core::parse` read like libcore to every reviewer. Rename per project
# (keep a suffix/prefix, e.g. lsof_core).
name = "port_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# No dependencies by default. Every dependency added here must clear the
# supply-chain gate (harnesses/supply-chain). Keep the trusted surface small.
[dependencies]

[lints]
workspace = true
